[book]
authors = ["HackTricks Team"]
language = "en"
src = "src"
title = "HackTricks"

[build]
create-missing = false
extra-watch-dirs = ["translations"]

[preprocessor.tabs]

[preprocessor.hacktricks]
command = "python3 ./hacktricks-preprocessor.py"
env = "prod"

[output.html]
additional-css = ["theme/tabs.css", "theme/pagetoc.css", "theme/discount.css"]
additional-js = [
    "theme/tabs.js",
    "theme/pagetoc.js",
    "theme/ht_searcher.js",
    "theme/sponsor.js",
    "theme/discount.js",
    "theme/motion.js",
    "theme/ai.js"
]
no-section-label = true
preferred-dark-theme = "hacktricks-dark"
default-theme = "hacktricks-light"
hash-files = false

[output.html.redirect]
"/todo/industrial-control-systems-hacking/index.html" = "../../industrial-control-systems/index.html"
"/todo/industrial-control-systems-hacking/modbus.html" = "../../network-services-pentesting/pentesting-modbus.html"
"/todo/android-forensics.html" = "../generic-methodologies-and-resources/basic-forensic-methodology/android-forensics.html"
"/todo/hardware-hacking/index.html" = "../../hardware-physical-access/hardware-hacking/index.html"
"/todo/hardware-hacking/fault_injection_attacks.html" = "../../hardware-physical-access/hardware-hacking/fault_injection_attacks.html"
"/todo/hardware-hacking/i2c.html" = "../../hardware-physical-access/hardware-hacking/i2c.html"
"/todo/hardware-hacking/side_channel_analysis.html" = "../../hardware-physical-access/hardware-hacking/side_channel_analysis.html"
"/todo/hardware-hacking/uart.html" = "../../hardware-physical-access/hardware-hacking/uart.html"
"/todo/hardware-hacking/radio.html" = "../../hardware-physical-access/hardware-hacking/radio.html"
"/todo/hardware-hacking/jtag.html" = "../../hardware-physical-access/hardware-hacking/jtag.html"
"/todo/hardware-hacking/spi.html" = "../../hardware-physical-access/hardware-hacking/spi.html"
"/linux-hardening/main-system-information/kernel-lpe-cves/posix-cpu-timers-toctou-cve-2025-38352.html" = "../../../binary-exploitation/linux-kernel-exploitation/posix-cpu-timers-toctou-cve-2025-38352.html"
"/windows-hardening/lateral-movement/scmexec.html" = "psexec-and-winexec.html"
"/linux-hardening/post-exploitation/linux-post-exploitation/index.html" = "/linux-hardening/post-exploitation/index.html"
"/linux-hardening/post-exploitation/linux-post-exploitation/trojanized-system-daemons-and-reverse-proxies.html" = "/linux-hardening/post-exploitation/trojanized-system-daemons-and-reverse-proxies.html"

[output.html.fold]
enable = true # whether or not to enable section folding
level = 0     # the depth to start folding


[output.html.print]
enable = false # whether or not to enable print
