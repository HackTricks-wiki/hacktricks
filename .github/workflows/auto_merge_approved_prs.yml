name: Auto Merge Approved PRs

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Translate All", "Build Master"]
    types: [completed]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Optional PR number for a targeted merge check
        type: number
        default: 0
  # Recover the approval queue even if a completion trigger is missed.
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: auto-merge-approved-prs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge-prs:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'carlospolop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # These triggers have write permissions: use only default-branch code.
      - name: Checkout trusted merger code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Merge verified approved PRs promptly
        run: python3 scripts/merge_approved_prs.py
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
