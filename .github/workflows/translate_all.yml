name: Translate All

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.gitignore'
      - Dockerfile
      - '.github/**'
      - 'scripts/merge_approved_prs.py'
      - 'scripts/test_merge_approved_prs.py'
      # Tool-only releases can be reviewed and dispatched without scheduling a book backfill.
      - 'scripts/translation_backlog.py'
      - 'scripts/audit_translation_editions.py'
      - 'scripts/test_translation_editions.py'
      - 'scripts/translation_matrix.py'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/translate_all.yml'
      - 'scripts/translation*.py'
      - 'scripts/audit_translation_editions.py'
      - 'scripts/seo_postprocess.py'
      - 'scripts/render_localized_error.py'
      - '.github/workflows/build_master.yml'
      - 'scripts/translator.py'
      - 'scripts/test_translat*.py'
      - 'theme/index.hbs'
      - 'theme/book.js'
      - 'theme/ht_searcher.js'
      - 'scripts/test_navigation_l10n.js'
      - 'scripts/test_search.js'
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Run translator checks without publishing"
        type: boolean
        default: false
      audit_only:
        description: "Audit every published language branch and save a report without deploying"
        type: boolean
        default: false
      error_pages_only:
        description: "Build and publish localized 404 pages only"
        type: boolean
        default: false
      ui_assets_only:
        description: "Publish localized navigation and search JavaScript only"
        type: boolean
        default: false
      navigation_only:
        description: "Translate and publish sidebar labels only"
        type: boolean
        default: false
      landing_only:
        description: "Publish existing landing pages, with existing sidebars if navigation_only is also enabled"
        type: boolean
        default: false
      files:
        description: "Optional comma-separated src/*.md paths to retry in addition to the language backlog"
        required: false
        default: ''
      translation_base_sha:
        description: "Optional base commit for a catch-up translation range"
        required: false
        type: string
      translation_head_sha:
        description: "Optional head commit for a catch-up translation range"
        required: false
        type: string
      only_language:
        description: "Optional language branch code to resume only that language"
        required: false
        default: ''
      batch_size:
        description: "Pages per translation batch"
        type: choice
        options: ['20', '40', '80']
        required: false
        default: '80'

permissions:
  contents: read

env:
  # Keep the shared validator and deployment tools on the same immutable revision.
  SHARED_TRANSLATOR_REF: 3607c1da42dd06295ae988cfc4e115256ea5b192

jobs:
  validate:
    name: Validate translation tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/hacktricks-wiki/hacktricks-cloud/translator-image:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check py3langid==0.4.0 markdown-it-py==4.3.0
          shared_url="https://raw.githubusercontent.com/HackTricks-wiki/hacktricks-cloud/$SHARED_TRANSLATOR_REF/scripts"
          workdir=$(mktemp -d)
          for script in translator translation_backlog translation_quality \
              test_translator_directives test_translator_batch test_translator_code_blocks test_translator_tokenizers \
              test_translation_backlog audit_translation_editions test_translation_editions; do
            wget -O "$workdir/$script.py" "$shared_url/$script.py"
          done
          wget -O "$workdir/push_branch_with_retry.sh" "$shared_url/push_branch_with_retry.sh"
          cp scripts/translation_matrix.py "$workdir/"
          python -m unittest discover -s "$workdir" -p 'test_translat*.py'
          python -m unittest discover -s scripts -p 'test_translation_*.py'
          python scripts/translation_matrix.py --check-menu theme/index.hbs
          node --test scripts/test_navigation_l10n.js scripts/test_search.js

  review-language-editions:
    name: Audit every translation edition
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_only && !inputs.validate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/hacktricks-wiki/hacktricks-cloud/translator-image:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare published Git revisions
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m pip install --disable-pip-version-check py3langid==0.4.0 markdown-it-py==4.3.0
          shared_url="https://raw.githubusercontent.com/HackTricks-wiki/hacktricks-cloud/$SHARED_TRANSLATOR_REF/scripts"
          workdir=$(mktemp -d)
          for script in translation_backlog translation_quality audit_translation_editions; do
            wget -nv -O "$workdir/$script.py" "$shared_url/$script.py"
          done
          cp scripts/translation_matrix.py "$workdir/"
          python "$workdir/audit_translation_editions.py" --output "$RUNNER_TEMP/translation-audit.json"
      - uses: actions/upload-artifact@v7
        with:
          name: translation-audit
          path: ${{ runner.temp }}/translation-audit.json
          if-no-files-found: error

  publish-error-pages:
    name: Publish localized site files
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.error_pages_only || inputs.ui_assets_only) && !inputs.validate_only && !inputs.audit_only }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency:
      group: localized-error-pages
      cancel-in-progress: false
    container:
      image: ghcr.io/hacktricks-wiki/hacktricks-cloud/translator-image:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Render missing pages in an isolated book
        if: ${{ inputs.error_pages_only }}
        run: python3 scripts/render_localized_error.py --publish-dir "$RUNNER_TEMP/localized-errors"
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish only the localized error pages
        if: ${{ inputs.error_pages_only }}
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/localized-errors"
          paths=()
          for file in "$directory"/[a-z][a-z]/404.html "$directory"/404.html; do
            test -s "$file"
            path="${file#"$directory"/}"
            aws s3 cp "$file" "s3://hacktricks-wiki/$path" --content-type "text/html; charset=utf-8" --no-progress
            paths+=("/$path")
          done
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "${paths[@]}"

      - name: Publish only localized navigation and search scripts
        if: ${{ inputs.ui_assets_only }}
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          UI_ASSET_BASELINE: 6166b0c61528274710d07a54f38440c12714b946
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          PYTHONPATH=scripts python3 -c 'from translation_matrix import MENU_LABELS; print(*sorted(MENU_LABELS), sep=chr(10))' > "$workdir/locales"
          locales=()
          while IFS= read -r locale; do
            locales+=("$locale")
          done < "$workdir/locales"
          assets=(book.js theme/ht_searcher.js)
          paths=()
          files=()
          # Compare every object before uploading any replacement.
          for asset in "${assets[@]}"; do
            source="theme/${asset##*/}"
            baseline="$workdir/${asset##*/}.baseline"
            git -c safe.directory="$GITHUB_WORKSPACE" show "refs/remotes/origin/master:$source" > "$baseline"
            released="$workdir/${asset##*/}.released"
            git -c safe.directory="$GITHUB_WORKSPACE" show "$UI_ASSET_BASELINE:$source" > "$released"
            for locale in "${locales[@]}"; do
              path="$locale/$asset"
              aws s3 cp "s3://hacktricks-wiki/$path" "$workdir/current" --only-show-errors
              if cmp -s "$source" "$workdir/current"; then
                continue
              fi
              if ! cmp -s "$baseline" "$workdir/current" && ! cmp -s "$released" "$workdir/current"; then
                echo "Unexpected version at /$path. No scripts were uploaded."
                exit 1
              fi
              paths+=("/$path")
              files+=("$source")
            done
          done
          if [ -z "${paths[*]-}" ]; then
            echo "The current assets already match this revision."
            exit 0
          fi
          for index in "${!paths[@]}"; do
            aws s3 cp "${files[$index]}" "s3://hacktricks-wiki${paths[$index]}" --content-type "application/javascript; charset=utf-8" --no-progress
          done
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "${paths[@]}" /book.js /theme/ht_searcher.js

  select-languages:
    if: ${{ github.event_name != 'pull_request' && !inputs.validate_only && !inputs.audit_only && !inputs.error_pages_only && !inputs.ui_assets_only }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: select
        env:
          ONLY_LANGUAGE: ${{ inputs.only_language }}
          LANDING_ONLY: ${{ inputs.landing_only }}
        run: |
          if [[ "$LANDING_ONLY" == true && -z "$ONLY_LANGUAGE" ]]; then
            echo "Landing-page publishing requires an explicit language selection." >&2
            exit 1
          fi
          python3 scripts/translation_matrix.py --only "$ONLY_LANGUAGE" >> "$GITHUB_OUTPUT"

  translate:
    name: Translate → ${{ matrix.name }} (${{ matrix.branch }})
    needs: [validate, select-languages]
    permissions:
      packages: write
      id-token: write
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest

    # Run N languages in parallel (tune max-parallel if needed)
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.navigation_only && !inputs.landing_only && 8 || 17 }}
      matrix: ${{ fromJSON(needs.select-languages.outputs.matrix) }}

    # Ensure only one job per branch runs at a time (even across workflow runs)
    concurrency:
      group: translate-cloud-${{ matrix.branch }}
      cancel-in-progress: false

    container:
      image: ghcr.io/hacktricks-wiki/hacktricks-cloud/translator-image:latest

    env:
      LANDING_ONLY: ${{ inputs.landing_only }}
      NAVIGATION_ONLY: ${{ inputs.navigation_only }}
      LANGUAGE: ${{ matrix.language }}
      BRANCH:   ${{ matrix.branch }}
      # Seed older branches from the English snapshot before the reported gap.
      INITIAL_SOURCE_REF: 8481cea2a23b5c7f8eaec13775164aee08e2db00

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Pin source and download shared translation scripts
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source_ref=$(git rev-parse refs/remotes/origin/master)
          echo "SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          cp scripts/render_localized_error.py scripts/translation_matrix.py /tmp/
          git checkout --detach "$source_ref"
          python -m pip install --disable-pip-version-check py3langid==0.4.0 markdown-it-py==4.3.0
          cp .github/build_compact_search_index.py /tmp/build_compact_search_index.py
          cp theme/ht_searcher.js /tmp/ht_searcher.js
          shared_url="https://raw.githubusercontent.com/HackTricks-wiki/hacktricks-cloud/$SHARED_TRANSLATOR_REF/scripts"
          for script in translator translation_backlog translation_quality get_and_save_refs compare_and_fix_refs; do
            wget -O "/tmp/$script.py" "$shared_url/$script.py"
          done
          wget -O /tmp/push_branch_with_retry.sh "$shared_url/push_branch_with_retry.sh"
          cp scripts/mark_unchanged_s3_files.py /tmp/mark_unchanged_s3_files.py
          cp scripts/upload_immutable_images.sh /tmp/upload_immutable_images.sh
          mkdir -p /tmp/immutable-images
          cp \
            src/images/hacktricks-summer-discount-2026-v1.webp \
            src/images/hacktricks-black-friday-2026-v1.webp \
            src/images/arte-badge-v1.webp \
            src/images/grte-badge-v1.webp \
            src/images/azrte-badge-v1.webp \
            src/images/krte-badge-v1.webp \
            src/images/lhe-badge-v1.webp \
            src/images/lee-badge-v1.webp \
            src/images/lee-sponsor-v1.webp \
            src/images/azrte-sponsor-v1.webp \
            src/images/grte-sponsor-v1.webp \
            src/images/lhe-sponsor-v1.webp \
            src/images/arte-sponsor-v1.webp \
            /tmp/immutable-images/
          cp theme/discount.js /tmp/discount.js
          cp theme/discount.css /tmp/discount.css
          cp scripts/seo_postprocess.py /tmp/seo_postprocess.py

      - name: Save reference data
        if: ${{ !inputs.navigation_only && !inputs.landing_only }}
        run: python /tmp/get_and_save_refs.py

      - name: Download language branch and update refs
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name 'Translator'
          git config --global user.email 'github-actions@github.com'
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          if [[ "$NAVIGATION_ONLY" == true || "$LANDING_ONLY" == true ]]; then
            exit 0
          fi
          python /tmp/compare_and_fix_refs.py --files-unmatched-paths /tmp/ref-mismatches.txt
          # Separate the CSV emitted by the refs helper from any manual paths.
          printf '\n' >> /tmp/ref-mismatches.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix unmatched refs"
            bash /tmp/push_branch_with_retry.sh "$BRANCH"
          fi

      - name: Translate and verify pending pages
        if: ${{ !inputs.landing_only }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_FILES: ${{ inputs.files }}
          BATCH_SIZE: ${{ inputs.batch_size || '80' }}
          TRANSLATION_BASE_SHA: ${{ inputs.translation_base_sha }}
          TRANSLATION_HEAD_SHA: ${{ inputs.translation_head_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_REF"
          if [[ "$NAVIGATION_ONLY" == true ]]; then
            python /tmp/translator.py \
              --language "$LANGUAGE" --branch "$BRANCH" --api-key "$OPENAI_API_KEY" \
              --source-ref "$SOURCE_REF" --initial-source-ref "$INITIAL_SOURCE_REF" \
              --record-source --file-paths src/SUMMARY.md --navigation-only
            exit 0
          fi
          if [[ -n "$TRANSLATION_BASE_SHA" || -n "$TRANSLATION_HEAD_SHA" ]]; then
            head_sha=$(git rev-parse --verify "${TRANSLATION_HEAD_SHA:-$SOURCE_REF}^{commit}")
            base_sha=$(git rev-parse --verify "${TRANSLATION_BASE_SHA:-${head_sha}^}^{commit}")
            git -c core.quotePath=false diff --name-only "$base_sha" "$head_sha" -- src >> /tmp/ref-mismatches.txt
          fi
          if [[ ! "$BATCH_SIZE" =~ ^(20|40|80)$ ]]; then
            echo "Invalid batch size: $BATCH_SIZE" >&2
            exit 1
          fi

          backlog=(python /tmp/translation_backlog.py)
          scope=(--language "$BRANCH" --source-ref "$SOURCE_REF" --initial-source-ref "$INITIAL_SOURCE_REF")
          "${backlog[@]}" plan "${scope[@]}" \
            --output /tmp/pending-pages.txt --extras /tmp/ref-mismatches.txt --extra-env INPUT_FILES

          if [ -s /tmp/pending-pages.txt ]; then
            split -l "$BATCH_SIZE" -d -a 3 /tmp/pending-pages.txt /tmp/translation-batch-
          else
            # Keep shared book configuration and assets in sync without translating any pages.
            cp /tmp/pending-pages.txt /tmp/translation-batch-000
          fi
          batches=(/tmp/translation-batch-*)
          last_batch="${batches[${#batches[@]}-1]}"
          for batch in "${batches[@]}"; do
            options=()
            if [[ "$batch" != "$last_batch" ]]; then
              options+=(--keep-removed)
            fi
            git checkout --detach "$SOURCE_REF"
            python /tmp/translator.py \
              --language "$LANGUAGE" --branch "$BRANCH" --api-key "$OPENAI_API_KEY" \
              --source-ref "$SOURCE_REF" --initial-source-ref "$INITIAL_SOURCE_REF" \
              --record-source --file-list "$batch" --threads 3 "${options[@]}"
          done
          "${backlog[@]}" verify "${scope[@]}"

      - name: Build mdBook
        shell: bash
        run: |
          git checkout "$BRANCH"
          navigation_options=()
          if [ "$LANDING_ONLY" = true ]; then
            navigation_options+=(--landing)
          fi
          python /tmp/translation_backlog.py verify-navigation --language "$BRANCH" --source-ref "$SOURCE_REF" "${navigation_options[@]}"
          if [ "$NAVIGATION_ONLY" = true ] && [ "$LANDING_ONLY" != true ]; then
            export MDBOOK_OUTPUT__HTML__SEARCH__ENABLE=false
          else
            python /tmp/translation_backlog.py restore-anchors --language "$BRANCH" --source-ref "$SOURCE_REF"
            python /tmp/render_localized_error.py --language "$BRANCH"
          fi
          MDBOOK_BOOK__LANGUAGE=$BRANCH mdbook build || (echo "Error logs" && cat hacktricks-preprocessor-error.log && echo "" && echo "" && echo "Debug logs" && (cat hacktricks-preprocessor.log | tail -n 20) && exit 1)
          python /tmp/translation_backlog.py verify-render --language "$BRANCH" --toc book/toc.html --toc-script book/toc.js
          if [ "$NAVIGATION_ONLY" != true ] && [ "$LANDING_ONLY" != true ]; then
            python /tmp/render_localized_error.py --language "$BRANCH" --rendered
          fi
          if [ "$NAVIGATION_ONLY" = true ] || [ "$LANDING_ONLY" = true ]; then
            exit 0
          fi
          cp /tmp/immutable-images/* ./book/images/
          cp /tmp/discount.js ./book/discount.js
          mkdir -p ./book/theme
          cp /tmp/discount.js ./book/theme/discount.js
          cp /tmp/discount.css ./book/discount.css
          cp /tmp/discount.css ./book/theme/discount.css
          cp /tmp/ht_searcher.js ./book/theme/ht_searcher.js
      
      - name: Push search index to hacktricks-searchindex repo
        if: ${{ !inputs.navigation_only && !inputs.landing_only }}
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          ASSET="book/searchindex.js"
          COMPACT_ASSET="/tmp/searchindex-v2.json"
          TARGET_REPO="HackTricks-wiki/hacktricks-searchindex"
          FILENAME="searchindex-${BRANCH}.js"
          COMPACT_FILENAME="searchindex-v2-${BRANCH}.json"

          if [ ! -f "$ASSET" ]; then
            echo "Expected $ASSET to exist after build" >&2
            exit 1
          fi

          TOKEN="${PAT_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No PAT_TOKEN available" >&2
            exit 1
          fi

          # Clone the searchindex repo
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" /tmp/searchindex-repo
          
          # Compress the searchindex file
          python3 /tmp/build_compact_search_index.py "$ASSET" "$COMPACT_ASSET"
          gzip -9 -k -f "$ASSET"
          gzip -9 -k -f "$COMPACT_ASSET"
          
          # Show compression stats
          ORIGINAL_SIZE=$(wc -c < "$ASSET")
          COMPRESSED_SIZE=$(wc -c < "${ASSET}.gz")
          RATIO=$(awk "BEGIN {printf \"%.1f\", ($COMPRESSED_SIZE / $ORIGINAL_SIZE) * 100}")
          echo "Compression: ${ORIGINAL_SIZE} bytes -> ${COMPRESSED_SIZE} bytes (${RATIO}%)"
          
          # XOR encrypt the compressed file
          KEY='Prevent_Online_AVs_From_Flagging_HackTricks_Search_Gzip_As_Malicious_394h7gt8rf9u3rf9g'
          cat > /tmp/xor_encrypt.py << 'EOF'
          import sys
          key = sys.argv[1]
          input_file = sys.argv[2]
          output_file = sys.argv[3]
          with open(input_file, 'rb') as f:
              data = f.read()
          key_bytes = key.encode('utf-8')
          encrypted = bytearray(len(data))
          for i in range(len(data)):
              encrypted[i] = data[i] ^ key_bytes[i % len(key_bytes)]
          with open(output_file, 'wb') as f:
              f.write(encrypted)
          print(f"Encrypted: {len(data)} bytes")
          EOF
          python3 /tmp/xor_encrypt.py "$KEY" "${ASSET}.gz" "${ASSET}.gz.enc"
          python3 /tmp/xor_encrypt.py "$KEY" "${COMPACT_ASSET}.gz" "${COMPACT_ASSET}.gz.enc"
          
          # Copy ONLY the encrypted .gz version to the searchindex repo (no uncompressed .js)
          cp "${ASSET}.gz.enc" "/tmp/searchindex-repo/${FILENAME}.gz"
          cp "${COMPACT_ASSET}.gz.enc" "/tmp/searchindex-repo/${COMPACT_FILENAME}.gz"
          
          # Commit and push with retry logic
          cd /tmp/searchindex-repo
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add "${FILENAME}.gz" "${COMPACT_FILENAME}.gz"
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ${FILENAME} from hacktricks-cloud build"
            
            # Retry push up to 20 times with pull --rebase between attempts
            MAX_RETRIES=20
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if git push origin master; then
                echo "Successfully pushed on attempt $((RETRY_COUNT + 1))"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Push failed, attempt $RETRY_COUNT/$MAX_RETRIES. Pulling and retrying..."
                  
                  # Try normal rebase first
                  if git pull --rebase origin master 2>&1 | tee /tmp/pull_output.txt; then
                    echo "Rebase successful, retrying push..."
                  else
                    # If rebase fails due to divergent histories (orphan branch reset), re-clone
                    if grep -q "unrelated histories\|refusing to merge\|fatal: invalid upstream\|couldn't find remote ref" /tmp/pull_output.txt; then
                      echo "Detected history rewrite, re-cloning repository..."
                      cd /tmp
                      rm -rf searchindex-repo
                      git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" searchindex-repo
                      cd searchindex-repo
                      git config user.name "GitHub Actions"
                      git config user.email "github-actions@github.com"
                      
                      # Re-copy ONLY the encrypted .gz version (no uncompressed .js)
                      cp "${GITHUB_WORKSPACE}/${ASSET}.gz.enc" "${FILENAME}.gz"
                      cp "${COMPACT_ASSET}.gz.enc" "${COMPACT_FILENAME}.gz"
                      
                      git add "${FILENAME}.gz" "${COMPACT_FILENAME}.gz"
                      git commit -m "Update ${FILENAME}.gz from hacktricks-cloud build"
                      echo "Re-cloned and re-committed, will retry push..."
                    else
                      echo "Rebase failed for unknown reason, retrying anyway..."
                    fi
                  fi
                  
                  sleep 1
                else
                  echo "Failed to push after $MAX_RETRIES attempts"
                  exit 1
                fi
              fi
            done
          fi

      # Login in AWS
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish translated sidebar
        if: ${{ inputs.navigation_only }}
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -s book/toc.html
          test -s book/toc.js
          aws s3 cp book/toc.html "s3://hacktricks-wiki/$BRANCH/toc.html"
          aws s3 cp book/toc.js "s3://hacktricks-wiki/$BRANCH/toc.js"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/$BRANCH/toc.html" "/$BRANCH/toc.js"

      - name: Post-process SEO artifacts
        if: ${{ !inputs.navigation_only || inputs.landing_only }}
        run: |
          python3 /tmp/seo_postprocess.py pages \
            --book-dir ./book \
            --site-url https://hacktricks.wiki \
            --lang "$BRANCH" \
            --default-lang en \
            --site-name "HackTricks"
      
      - name: Publish only the localized landing page
        if: ${{ inputs.landing_only }}
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -s book/index.html
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          aws s3 cp book/index.html "s3://hacktricks-wiki/$BRANCH/index.html" --content-type "text/html; charset=utf-8" --no-progress
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/$BRANCH/" "/$BRANCH/index.html"

      # Sync the build to S3
      - name: Sync to S3
        if: ${{ !inputs.navigation_only && !inputs.landing_only }}
        run: |
          echo "Current branch:"
          git rev-parse --abbrev-ref HEAD
          echo "Syncing $BRANCH to S3"
          # mdBook refreshes mtimes on every build. Age byte-identical files
          # based on single-part S3 ETags so `s3 sync` skips redundant PUTs.
          aws s3api list-objects-v2 \
            --bucket hacktricks-wiki \
            --prefix "$BRANCH/" \
            --output json > /tmp/s3-branch-manifest.json
          python3 /tmp/mark_unchanged_s3_files.py \
            --source ./book \
            --manifest /tmp/s3-branch-manifest.json \
            --remote-prefix "$BRANCH/"
          aws s3 sync ./book "s3://hacktricks-wiki/$BRANCH" --delete
          bash /tmp/upload_immutable_images.sh hacktricks-wiki "$BRANCH"
          echo "Sync completed"
          echo "Cat 3 files from the book"
          find . -type f -name 'index.html' -print | head -n 3 | xargs -r cat

  finalize-deployment:
    name: Finalize translated deployment
    needs: translate
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && !inputs.validate_only && !inputs.audit_only && !inputs.error_pages_only && !inputs.ui_assets_only && !inputs.navigation_only && !inputs.landing_only && needs.translate.result != 'skipped' }}
    permissions:
      packages: write
      id-token: write
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Refresh root sitemap index
        shell: bash
        run: |
          set -euo pipefail
          LANGS=$(aws s3api list-objects-v2 --bucket hacktricks-wiki --delimiter / --query 'CommonPrefixes[].Prefix' --output text | tr '\t' '\n' | sed 's:/$::' | grep -E '^[a-z]{2}$' | sort | paste -sd, - || true)
          if [ -z "$LANGS" ]; then
            LANGS="en"
          fi
          python3 scripts/seo_postprocess.py index \
            --site-url https://hacktricks.wiki \
            --languages "$LANGS" \
            --output ./sitemap.xml
          if aws s3 cp s3://hacktricks-wiki/sitemap.xml /tmp/current-root-sitemap.xml >/dev/null 2>&1 && cmp -s /tmp/current-root-sitemap.xml ./sitemap.xml; then
            echo "Root sitemap unchanged; skipping its upload."
          else
            aws s3 cp ./sitemap.xml s3://hacktricks-wiki/sitemap.xml \
              --content-type application/xml \
              --cache-control max-age=300
          fi

      # A push to the default branch fans out into several workflows that each
      # invalidate an overlapping set of paths, and CloudFront bills every path
      # past the first 1000 a month. Skip the ones another run already covers.
      - name: Check whether this invalidation is still needed
        id: invalidation
        uses: ./.github/actions/invalidation-needed
        with:
          github-token: ${{ github.token }}
          merge-comment-author: "carlospolop"

      - name: Invalidate translated HTML and SEO assets once
        if: steps.invalidation.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
